# =============================================================================
# application.yml — user-BFF 서비스 환경설정
#
# 본 파일은 user-BFF (service-user) 의 모든 런타임 설정을 모은다.
# 각 섹션이 어떤 빈/컴포넌트에서 참조되는지 함께 표기한다.
#
# 섹션 개요:
# - spring.application : 서비스 식별자
# - spring.datasource  : PostgreSQL 연결 (user_service 스키마 사용)
# - spring.jpa         : Hibernate ddl-auto=validate (스키마 변경 금지)
# - spring.flyway      : db/migration 마이그레이션 자동 실행 (user_service 스키마)
# - spring.data.redis  : 기본 연결 (DB0). repositories.enabled=false 로
#                        Spring Data Redis Repository 자동 활성화 비활성
# - spring.jackson     : LocalDate / LocalTime 등 시간 직렬화 정책, 미정의 필드 허용
# - agent              : agent 서비스 호출 설정 (AgentClientConfig 참조)
# - streams            : Redis Streams 컨슈머 그룹 설정 (StreamsConsumerConfig 참조)
# - redis.db-*         : 멀티 DB 번호 매핑 (RedisConfig 가 참조)
# - server             : 서비스 포트
# - management         : Actuator 노출 엔드포인트
# - jwt                : RS256 서명 키쌍 및 토큰 TTL
# - kakao              : Kakao OAuth 클라이언트 설정 (KakaoProperties 참조)
# - cors               : 교차 출처 허용 정책 (CorsProperties 참조)
#
# 참고:
# - ServiceUserApplication 에서 RedisRepositoriesAutoConfiguration 을 제외하므로
#   data.redis.repositories.enabled=false 와 함께 Redis Repository 자동 활성화를
#   두 단계로 차단한다.
# =============================================================================

# ---- spring.application : 서비스 이름 (액추에이터/로그 등에서 표시) ----
spring:
  application:
    name: service-user
  # ---- spring.datasource : PostgreSQL JDBC 연결 ----
  # currentSchema=user_service 로 본 BFF 전용 스키마를 지정한다.
  # 호스트/포트/DB/계정/비밀번호는 모두 환경변수에서 주입한다.
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB:map}?currentSchema=user_service
    username: ${POSTGRES_USER:map}
    password: ${POSTGRES_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  # ---- spring.jpa : Hibernate / JPA 설정 ----
  # ddl-auto=validate : 엔티티 매핑이 DB 스키마와 일치하는지 검증만 한다.
  #                     스키마 변경은 Flyway 가 단독으로 담당한다.
  # hibernate.default_schema : 엔티티의 기본 스키마를 user_service 로 고정.
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: user_service
  # ---- spring.flyway : 마이그레이션 ----
  # schemas / default-schema : user_service 스키마에 대해서만 마이그레이션 적용.
  # locations : classpath:db/migration 에 위치한 V001 / V002 SQL 을 자동 실행.
  flyway:
    enabled: true
    schemas: user_service
    default-schema: user_service
    locations: classpath:db/migration
  # ---- spring.data.redis : 기본 Redis 연결 ----
  # host / port 는 RedisConfig 가 spring.data.redis.host / port 로 주입받아 사용.
  # repositories.enabled=false : Spring Data Redis 의 Repository 자동 활성화 차단.
  #   (ServiceUserApplication 의 RedisRepositoriesAutoConfiguration 제외와 함께
  #    JPA Repository 와의 충돌을 두 단계로 회피한다.)
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      # password : Redis AUTH 비밀번호. 비우면 무인증(현행 동작). RedisConfig 가
      #            비어있지 않을 때만 모든 용도별 ConnectionFactory 에 적용한다.
      password: ${REDIS_PASSWORD:}
      repositories:
        enabled: false
  # ---- spring.jackson : JSON 직렬화 정책 ----
  # write-dates-as-timestamps=false : 시간 타입을 epoch 가 아닌 ISO 문자열로 직렬화.
  # fail-on-unknown-properties=false : 응답 본문에 모르는 필드가 있어도 실패하지 않음.
  # time-zone=Asia/Seoul : 직렬화 시 기본 타임존.
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    time-zone: Asia/Seoul

# ---- agent : agent 서비스 호출 설정 ----
# AgentClientConfig 가 본 섹션을 참조하여 RestClient 빈을 구성한다.
# - base-url        : agent 서비스 base URL
# - timeout-seconds : RestClient 의 readTimeout (초)
# - internal-token  : B2 내부 서비스 인증 토큰(SoT §5.5). 비우면 헤더 미부착.
#                     agent 의 INTERNAL_SERVICE_TOKEN 과 동일 값이어야 한다.
agent:
  base-url: ${AGENT_BASE_URL:http://agent:8000}
  timeout-seconds: ${AGENT_TIMEOUT_SECONDS:60}
  internal-token: ${INTERNAL_SERVICE_TOKEN:}

# ---- hub : hub 게이트웨이 호출 설정 (경계 B3) ----
# HubClientConfig 가 본 섹션을 참조하여 RestClient 빈을 구성한다.
# trip 응답의 weather_forecast 를 채우기 위해 HubWeatherClient 가 /v1/weather 를 호출한다.
# - base-url        : hub 서비스 base URL (도커: http://hub:8000, 로컬 BFF: http://localhost:8001)
# - timeout-seconds : RestClient 의 readTimeout (초)
# - internal-token  : 내부 서비스 인증 토큰. 비우면 헤더 미부착(현행). hub 의
#                     INTERNAL_SERVICE_TOKEN 과 동일 값이어야 한다.
hub:
  base-url: ${HUB_BASE_URL:http://hub:8000}
  timeout-seconds: ${HUB_TIMEOUT_SECONDS:5}
  internal-token: ${INTERNAL_SERVICE_TOKEN:}

# ---- internal.admin : /internal/admin/** 위임 가드 (경계 B9) ----
# InternalAdminGuardFilter / InternalAdminSecurityConfig 가 본 섹션을 참조한다.
# map-service-admin(운영 콘솔)이 회원/추천작업/DLQ 를 위임 조회·조작할 때 통과하는
# CIDR 화이트리스트 + 공유 토큰 가드. hub 의 internal_guard 규약을 미러링한다.
# - trusted-cidrs : 허용 사설 CIDR 목록(map-net 컨테이너 네트워크 한정)
# - token         : X-Internal-Token 기대값. INTERNAL_SERVICE_TOKEN 재사용.
#                   비우면 fail-closed(헤더가 있어도 일치 불가 → 접근 차단).
internal:
  admin:
    trusted-cidrs: ${USER_INTERNAL_TRUSTED_CIDRS:172.16.0.0/12,10.0.0.0/8,192.168.0.0/16}
    token: ${INTERNAL_SERVICE_TOKEN:}

# ---- trip : 동기 trip 생성 facade 설정 ----
# TripService 가 본 섹션을 참조한다.
# - poll-timeout-seconds : agent 추천 draft 를 기다리는 최대 시간(초). agent JOB_TIMEOUT 과 정합.
# - poll-interval-ms     : draft 폴링 간격(ms).
trip:
  poll-timeout-seconds: ${TRIP_POLL_TIMEOUT_SECONDS:120}
  poll-interval-ms: ${TRIP_POLL_INTERVAL_MS:700}

# ---- recommend : 추천 도메인 설정 ----
# ResearchLimitService 가 본 섹션을 참조한다.
# - research-daily-limit : Mode1 재추천 일일 한도(일정/잡 단위). KST 자정 리셋.
recommend:
  research-daily-limit: ${RESEARCH_DAILY_LIMIT:3}

# ---- streams : Redis Streams 컨슈머 설정 ----
# StreamsConsumerConfig / RecommendJobsConsumer 가 본 섹션을 참조한다.
# - recommend-stream     : 소비할 Stream 키
# - recommend-group      : 컨슈머 그룹명
# - recommend-consumer   : 컨슈머명 (예: user-1, user-2 형태)
# - recommend-dlq-stream : 재시도 초과 메시지를 적재하는 DLQ Stream 키
# - recommend-max-retry  : 최대 재시도 횟수 (Redis delivery count 기준)
# - recommend-dlq-maxlen : DLQ Stream 의 보존 길이 (XADD MAXLEN ~ N)
# - recommend-min-idle-ms        : reclaim 대상 최소 idle(ms)
# - recommend-reclaim-interval-ms: PEL reclaim 스케줄 주기(ms)
# - recommend-reclaim-batch      : reclaim 라운드당 XPENDING 조회 건수
# - command-timeout-sec          : streams 전용 Lettuce commandTimeout(초). 폴링 BLOCK(2초)에
#                                  여유를 두어 일시적 지연 시 폴 태스크 사망을 줄인다.
# - watchdog-interval-ms         : 구독 비활성 감지 시 재구독하는 워치독 주기(ms)
streams:
  recommend-stream: ${STREAM_NAME:agent:jobs:done}
  recommend-group: ${STREAM_GROUP:bff-result}
  recommend-consumer: ${STREAM_CONSUMER:user-1}
  recommend-dlq-stream: ${STREAM_DLQ:agent:jobs:done:dlq}
  recommend-max-retry: ${STREAM_MAX_RETRY:3}
  recommend-dlq-maxlen: ${STREAM_MAXLEN:2000}
  recommend-min-idle-ms: ${STREAM_MIN_IDLE_MS:60000}
  recommend-reclaim-interval-ms: ${STREAM_RECLAIM_INTERVAL_MS:30000}
  recommend-reclaim-batch: ${STREAM_RECLAIM_BATCH:64}
  command-timeout-sec: ${STREAMS_COMMAND_TIMEOUT_SEC:6}
  watchdog-interval-ms: ${STREAMS_WATCHDOG_INTERVAL_MS:10000}

# ---- redis : 용도별 Redis 논리 DB 번호 매핑 ----
# RedisConfig 가 본 섹션을 참조하여 용도별 ConnectionFactory 의 DB 번호를 결정한다.
# - db-default       : 기본 DB
# - db-blacklist     : JWT 블랙리스트 전용 (blacklistRedisTemplate)
# - db-streams       : Streams 전용 (streamsConnectionFactory)
# - db-counters      : 카운터 전용 (countersConnectionFactory)
# - db-ratelimit     : 인증 레이트리밋 전용 (rateLimitRedisTemplate)
# - db-drafts        : 초안 전용   (draftsConnectionFactory)
# - db-chat          : 채팅 전용   (chatConnectionFactory) — 프레즌스 키. 발행/구독 채널은 DB 무관
# - draft-ttl-seconds: 초안 키 기본 TTL (초)
redis:
  db-default: ${REDIS_DB_DEFAULT:0}
  db-blacklist: ${REDIS_DB_BLACKLIST:1}
  db-streams: ${REDIS_DB_STREAMS:2}
  db-counters: ${REDIS_DB_COUNTERS:3}
  db-ratelimit: ${REDIS_DB_RATELIMIT:3}
  db-drafts: ${REDIS_DB_DRAFTS:4}
  db-chat: ${REDIS_DB_CHAT:5}
  draft-ttl-seconds: ${REDIS_DRAFT_TTL_SECONDS:3600}

# ---- chat : 채팅 도메인 설정 ----
# ChatProperties 가 본 섹션을 참조한다.
# - max-participants        : 방당 ACTIVE 참가자 상한 (join 시 초과 차단)
# - expiry-grace-days       : 여행 종료일 이후 전송 허용 일수 (방 생성 시 만료 시각 계산에 사용)
# - history-page-size       : 메시지 히스토리 한 페이지 최대 건수
# - invite-base-url         : 초대 링크 기준 주소 (배포 시 실제 딥링크 주소로 오버라이드 필수)
# - max-message-length      : 텍스트 메시지 최대 글자 수 (초과 시 전송 거부)
# - send-rate-limit         : send-rate-window-seconds 창당 사용자별 최대 전송 수
# - send-rate-window-seconds: 전송 레이트리밋 시간 창(초)
# - broadcast-channel       : 인스턴스 간 팬아웃용 Redis 발행/구독 채널명
# - ws-endpoint             : WebSocket 핸드셰이크 경로
chat:
  max-participants: ${CHAT_MAX_PARTICIPANTS:10}
  expiry-grace-days: ${CHAT_EXPIRY_GRACE_DAYS:7}
  history-page-size: ${CHAT_HISTORY_PAGE_SIZE:50}
  invite-base-url: ${CHAT_INVITE_BASE_URL:https://example.invalid/chat/invite/}
  max-message-length: ${CHAT_MAX_MESSAGE_LENGTH:2000}
  send-rate-limit: ${CHAT_SEND_RATE_LIMIT:20}
  send-rate-window-seconds: ${CHAT_SEND_RATE_WINDOW_SECONDS:10}
  invite-rate-limit: ${CHAT_INVITE_RATE_LIMIT:10}
  invite-rate-window-seconds: ${CHAT_INVITE_RATE_WINDOW_SECONDS:60}
  broadcast-channel: ${CHAT_BROADCAST_CHANNEL:chat:broadcast}
  ws-endpoint: ${CHAT_WS_ENDPOINT:/ws/chat}
  expiry-sweep-interval-ms: ${CHAT_EXPIRY_SWEEP_INTERVAL_MS:60000}

# ---- server : 서블릿 컨테이너 포트 ----
# Dockerfile 의 EXPOSE 및 HEALTHCHECK 가 동일 포트를 가정한다.
server:
  port: 8080

# ---- management : Spring Boot Actuator ----
# - endpoints.web.exposure.include : 외부 노출 엔드포인트 (health, info, prometheus)
# - endpoint.health.probes.enabled : liveness / readiness 프로브 활성화
# - prometheus : micrometer-registry-prometheus 가 /actuator/prometheus 를 제공.
#   map-net 내부(loopback) Prometheus 만 스크레이프한다(SecurityConfig 공개 목록).
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  # http.server.requests 히스토그램 버킷 노출 → Grafana p95 등 분위수 쿼리 가능
  # (미설정 시 count/sum 만 노출되어 histogram_quantile 이 No data).
  metrics:
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true

# ---- jwt : JWT 발급/검증 설정 ----
# JwtProperties / JwtConfig 가 본 섹션을 참조하여 서명 키쌍과 토큰 만료를 구성한다.
# - private-key                 : 서명용 RSA 개인키 (Base64 PKCS8). 미설정 시 임시 키 생성
# - public-key                  : 검증용 RSA 공개키 (Base64 X509)
# - access-token-expiry-seconds : Access 토큰 유효기간 (초)
# - refresh-token-expiry-seconds: Refresh 토큰 유효기간 (초)
jwt:
  private-key: ${JWT_PRIVATE_KEY:}
  public-key: ${JWT_PUBLIC_KEY:}
  access-token-expiry-seconds: ${JWT_ACCESS_TTL:3600}
  refresh-token-expiry-seconds: ${JWT_REFRESH_TTL:2592000}

# ---- kakao : Kakao OAuth 클라이언트 설정 ----
# KakaoProperties / KakaoOAuthService 가 본 섹션을 참조한다.
# - client-id / client-secret : Kakao 앱 자격증명 (환경변수 주입)
# - redirect-uri              : 인가 코드 콜백 URI
# - token-uri / user-info-uri : Kakao 토큰 교환 / 사용자 정보 조회 엔드포인트
kakao:
  client-id: ${KAKAO_OAUTH_CLIENT_ID:}
  client-secret: ${KAKAO_OAUTH_CLIENT_SECRET:}
  redirect-uri: ${KAKAO_OAUTH_REDIRECT_URI:http://localhost:8080/api/v1/auth/kakao/callback}
  token-uri: ${KAKAO_TOKEN_URI:https://kauth.kakao.com/oauth/token}
  user-info-uri: ${KAKAO_USER_INFO_URI:https://kapi.kakao.com/v2/user/me}

# ---- cors : 교차 출처 허용 정책 ----
# CorsProperties / SecurityConfig 가 본 섹션을 참조한다.
# - allowed-origins : 허용 출처 목록. 와일드카드(*)는 자격증명 비포함 모드로 동작
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

# ---- auth : 인가 시행 플래그 ----
# SecurityConfig / AuthStartupValidator 가 본 섹션을 참조한다.
# - enforced=false(기본): 전 엔드포인트 공개(현행 동작 보존). 클라이언트 호환 유지.
# - enforced=true       : 도메인 엔드포인트 인증 필수. 부팅 시 JWT 키/CORS 전제 검증.
auth:
  enforced: ${AUTH_ENFORCED:false}
