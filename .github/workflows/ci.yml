# 되돌리기 어려운 사고를 사람 손보다 먼저 잡는 자리.
#
# 왜 두는가: 시험 스택을 늘 띄워 두는 것보다 싸고 확실하다. 사람은 "먼저
# 돌려 보기" 를 잊지만 여기는 잊지 않는다. 개발 기계의 메모리도 쓰지 않는다.
#
# 판을 박아 두는 이유: build.gradle 이 JDK 17 로 고정돼 있다. 여기서 다른
# 판으로 돌리면 통과한 것이 배포에서 깨질 수 있다.
#
# 이 검사가 특히 값진 지점: 마이그레이션과 엔티티가 어긋나면 부팅이 막히는데
# (ddl-auto=validate), 테스트가 그 불일치를 먼저 잡는다.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    # 부팅까지 하는 시험이 몇 개 있고, 그 부팅은 저장소를 구독하면서 끝난다.
    # 없으면 그 자리에서 죽는다. 만드는 사람 컴퓨터에는 대개 하나가 떠 있어
    # 통과하는데, 여기에는 없어서 그때만 실패한다 — 원인이 코드에 없으니
    # 찾는 데 오래 걸린다. 그래서 여기서 하나 띄운다.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: test
        run: ./gradlew --no-daemon clean test bootJar trainingExportJar

      - name: launch isolated exporter artifact
        run: python3 scripts/verify-training-export-launch.py

      - name: verify standalone migration entrypoint without database access
        run: python3 scripts/verify-user-migration-launch.py

      - name: verify one-use bootstrap entrypoint without database access
        run: python3 scripts/verify-user-bootstrap-launch.py

      - name: preserve migration launcher evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: user-migration-launch-verification
          path: build/user-migration-launch-verification.json
          if-no-files-found: ignore
          retention-days: 14

      - name: preserve exact candidate JAR for isolated PostgreSQL job
        uses: actions/upload-artifact@v4
        with:
          name: user-runtime-isolation-jar
          path: build/libs/service-user-0.0.1-SNAPSHOT.jar
          retention-days: 3

      # 실패한 것을 눈으로 볼 수 있어야 한다. 로그만 남기면 어느 단언이
      # 깨졌는지 확인하러 다시 돌려야 한다.
      - name: upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7

      # 만드는 이미지의 판과 래퍼의 판이 갈라지면, 손에서 통과한 것이 이미지
      # 안에서 다른 도구로 만들어진다. 어긋난 순간 여기서 멈춘다.
      - name: 만드는 판이 래퍼와 같은가
        run: |
          set -euo pipefail
          w=$(sed -n 's/.*gradle-\(.*\)-bin\.zip/\1/p' gradle/wrapper/gradle-wrapper.properties)
          d=$(sed -n 's/^FROM gradle:\([^-]*\)-.*/\1/p' Dockerfile)
          [ "$w" = "$d" ] || { echo "래퍼 $w · 이미지 $d 로 갈라져 있다"; exit 1; }

  database-isolation:
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        # docker.io/library/postgres:17-alpine, resolved Linux/amd64 digest 2026-09-07.
        image: postgres@sha256:7456ef82e5f5bc43d997f4781bbd7c0d6389bff397564649a356e206ba473aee
        env:
          POSTGRES_PASSWORD: synthetic-ci-database-only
          POSTGRES_DB: user_runtime_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d user_runtime_fixture"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: actions/download-artifact@v4
        with:
          name: user-runtime-isolation-jar
          path: build/libs
      - uses: actions/download-artifact@v4
        with:
          name: user-migration-launch-verification
          path: build
      - name: checkout immutable prior User source for realistic transition fixture
        uses: actions/checkout@v4
        with:
          repository: we-meet-trip/map-service-user
          ref: 1d4f394b51f471319eb9403f6e926a8d0a511c72
          path: legacy-source
      - name: build prior source for fixture only
        working-directory: legacy-source
        run: ./gradlew --no-daemon bootJar
      - name: install fixture clients and syscall observer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client redis-tools strace
      - name: genuine empty-host bootstrap and one-use role finalization
        env:
          MAP_HOSTED_DATABASE_FIXTURE: "true"
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: synthetic-ci-database-only
        run: python3 scripts/verify-user-bootstrap-postgres.py
      - name: preserve redacted bootstrap PostgreSQL evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: user-bootstrap-postgres-verification
          path: build/user-bootstrap-postgres-verification.json
          if-no-files-found: error
          retention-days: 14
      - name: actual PostgreSQL role migration and serving isolation
        env:
          MAP_HOSTED_DATABASE_FIXTURE: "true"
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGDATABASE: user_runtime_fixture
          PGUSER: postgres
          PGPASSWORD: synthetic-ci-database-only
        run: python3 scripts/verify-user-postgres-isolation.py
      - name: preserve redacted PostgreSQL evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: user-postgres-isolation-verification
          path: build/user-postgres-isolation-verification.json
          if-no-files-found: error
          retention-days: 14

  # Optional cross-repository release request; the infra receiver verifies this run.
  release-dispatch:
    needs: [test, database-isolation]
    if: >-
      needs.test.result == 'success' && needs.database-isolation.result == 'success' &&
      github.repository == 'we-meet-trip/map-service-user' &&
      github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    env:
      RELEASE_DISPATCH_TOKEN: ${{ secrets.RELEASE_DISPATCH_TOKEN }}
    steps:
      - name: request verified develop release
        if: ${{ env.RELEASE_DISPATCH_TOKEN != '' }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          payload = {
              "event_type": "release-develop",
              "client_payload": {
                  "repository": os.environ["GITHUB_REPOSITORY"],
                  "sha": os.environ["GITHUB_SHA"],
                  "run_id": os.environ["GITHUB_RUN_ID"],
              },
          }
          try:
              request = urllib.request.Request(
                  "https://api.github.com/repos/we-meet-trip/map-service-infra/dispatches",
                  data=json.dumps(payload).encode("utf-8"),
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Content-Type": "application/json",
                      "Authorization": "Bearer " + os.environ["RELEASE_DISPATCH_TOKEN"],
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
                  method="POST",
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  if response.status != 204:
                      raise SystemExit("Release dispatch failed")
          except Exception:
              # Never expose the token, response body, or exception details.
              raise SystemExit("Release dispatch failed") from None
          PY
